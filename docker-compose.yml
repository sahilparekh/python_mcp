version: '3.8'

services:
  python-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Google Cloud Storage configuration
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-your-actual-gcs-bucket-name}
      # Google Cloud authentication (if using service account key file)
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    volumes:
      # Mount Google Cloud service account key (optional)
      # Uncomment and update the path to your service account key file
      # - ./path/to/your/service-account-key.json:/app/gcp-key.json:ro
      
      # Mount for temporary file storage (optional)
      - ./temp_storage:/tmp/python_executor_temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs/allowed-libraries-versions')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy like nginx for production
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - python-mcp
  #   restart: unless-stopped
